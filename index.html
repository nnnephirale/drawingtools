<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Slip &amp; Metal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
/* Layout: one artboard centred in a stage, quiet frosted chrome floating around it (creative-tool-ui kit). */
:root{
  --page-a:#fcfcfb; --page-b:#f2f1ee;
  --ink:#1c1b19; --ink-2:#6b6862; --ink-3:#a3a09a;
  --panel:rgba(252,251,249,0.93);
  --line:rgba(0,0,0,0.055); --line-2:rgba(0,0,0,0.10);
  --fillbg:#f1efeb; --fillfg:#e2dfd8;
  --white:#ffffff;
  --danger:#c0787c;
  --toast:rgba(28,27,25,.92);
  --ease:cubic-bezier(0.16,1,0.3,1);
  --r:20px; --rail:306px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
  --safe-l:env(safe-area-inset-left,0px);
  --safe-r:env(safe-area-inset-right,0px);
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{
  background:linear-gradient(180deg,var(--page-a),var(--page-b));color:var(--ink);
  font-family:var(--mono);font-weight:300;font-size:12px;-webkit-font-smoothing:antialiased;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
}
button{font-family:inherit;touch-action:manipulation}

/* ── stage + artboard ─────────────────────────────── */
.stage{
  position:fixed;top:calc(64px + var(--safe-t));left:calc(24px + var(--safe-l));right:calc(24px + var(--safe-r));bottom:calc(96px + var(--safe-b));
  display:grid;place-items:center;transition:right .55s var(--ease),bottom .55s var(--ease);touch-action:none;
}
@media (min-width:780px){ body:has(.panel:not([hidden-state])) .stage{right:calc(var(--rail) + 42px + var(--safe-r))} }
.board{
  position:relative;border-radius:4px;transform-origin:50% 50%;will-change:transform;touch-action:none;
  box-shadow:0 1px 2px rgba(0,0,0,.04),0 30px 70px -24px rgba(0,0,0,.28);
  background-color:var(--white);
}
.board.clear{
  background-image:linear-gradient(45deg,var(--fillbg) 25%,transparent 25%,transparent 75%,var(--fillbg) 75%),
                   linear-gradient(45deg,var(--fillbg) 25%,transparent 25%,transparent 75%,var(--fillbg) 75%);
  background-size:16px 16px;background-position:0 0,8px 8px;
}
.board.easing{transition:transform .45s var(--ease)}
.board canvas{display:block;width:100%;height:100%;border-radius:inherit;touch-action:none}
.board.nocursor{cursor:none}
.board.grab{cursor:grab}
.guides{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.guides line{stroke:rgba(0,0,0,.16);stroke-width:1;vector-effect:non-scaling-stroke;stroke-dasharray:2 6}
.empty{
  position:absolute;left:0;right:0;bottom:22px;text-align:center;color:var(--ink-3);pointer-events:none;
  font-size:11px;letter-spacing:.06em;transition:opacity .6s var(--ease);
}
.empty.off{opacity:0}
.ring{
  position:fixed;left:0;top:0;border-radius:50%;pointer-events:none;z-index:4;opacity:0;
  border:1px solid rgba(0,0,0,.5);box-shadow:0 0 0 1px rgba(255,255,255,.55),inset 0 0 0 1px rgba(255,255,255,.35);
  transition:opacity .2s var(--ease);
}
.ring.on{opacity:1}
.ring.erase{border-style:dashed}

/* ── chrome ─────────────────────────────────────── */
.chrome{position:fixed;inset:0;pointer-events:none;z-index:5}
.chrome > *{pointer-events:auto}
.brand{
  position:absolute;top:calc(16px + var(--safe-t));left:calc(18px + var(--safe-l));
  font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);
}
.stat{
  position:absolute;top:calc(34px + var(--safe-t));left:calc(18px + var(--safe-l));
  font-size:10px;letter-spacing:.06em;color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap;
}
.iconbtn{
  appearance:none;border:1px solid var(--line);background:var(--panel);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  color:var(--ink-2);width:38px;height:38px;border-radius:13px;
  display:grid;place-items:center;cursor:pointer;padding:0;
  box-shadow:0 1px 2px rgba(0,0,0,.03),0 6px 18px -8px rgba(0,0,0,.10);
  transition:transform .35s var(--ease),color .3s var(--ease),box-shadow .35s var(--ease);
}
.iconbtn:hover{color:var(--ink);box-shadow:0 2px 4px rgba(0,0,0,.04),0 12px 26px -10px rgba(0,0,0,.16)}
.iconbtn:active{transform:scale(.94)}
svg.i{width:17px;height:17px;stroke:currentColor;stroke-width:1.3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.topright{position:absolute;top:calc(12px + var(--safe-t));right:calc(14px + var(--safe-r));display:flex;gap:8px;transition:right .55s var(--ease)}
@media (min-width:780px){ body:has(.panel:not([hidden-state])) .topright{right:calc(var(--rail) + 28px + var(--safe-r))} }

.zoombar{
  position:relative;height:38px;border-radius:13px;padding:0 3px;display:flex;align-items:center;gap:1px;
  border:1px solid var(--line);background:var(--panel);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);color:var(--ink-2);
  box-shadow:0 1px 2px rgba(0,0,0,.03),0 8px 24px -12px rgba(0,0,0,.18);
}
.zoombar button{
  appearance:none;border:0;background:transparent;cursor:pointer;color:inherit;height:30px;border-radius:10px;
  font:300 11px/1 var(--mono);letter-spacing:.06em;font-variant-numeric:tabular-nums;
  transition:color .3s var(--ease),background .3s var(--ease);
}
.zoombar button:hover{color:var(--ink);background:var(--fillbg)}
.zoombar .zstep{width:32px;font-size:14px}
.zoombar .zpct{min-width:58px;padding:0 8px}
.zoombar .zfit{padding:0 10px;letter-spacing:.12em;text-transform:uppercase;font-size:10px}
.zoombar .zfit[aria-pressed="true"]{color:var(--ink);background:var(--fillbg)}
.zsep{width:1px;height:14px;background:var(--line-2)}
.zmenu{
  position:absolute;right:0;top:calc(100% + 8px);min-width:120px;padding:5px;border-radius:14px;
  border:1px solid var(--line);background:var(--panel);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  box-shadow:0 1px 2px rgba(0,0,0,.03),0 16px 40px -16px rgba(0,0,0,.24);
  display:none;flex-direction:column;gap:1px;z-index:2;
}
.zmenu.on{display:flex}
.zmenu button{text-align:left;padding:0 10px;width:100%}
.zmenu button[aria-current="true"]{color:var(--ink);background:var(--fillbg)}
@media (max-width:779px){ .zoombar{position:absolute;right:0;top:calc(100% + 8px)} .stage{top:calc(110px + var(--safe-t))} }

/* ── tool pill ─────────────────────────────────── */
.pill{
  position:absolute;left:50%;bottom:calc(26px + var(--safe-b));transform:translateX(-50%);
  height:52px;border-radius:26px;padding:0 6px;
  border:1px solid var(--line);background:var(--panel);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  display:flex;align-items:center;gap:2px;color:var(--ink-2);white-space:nowrap;
  box-shadow:0 1px 2px rgba(0,0,0,.03),0 10px 30px -12px rgba(0,0,0,.20);
  transition:left .55s var(--ease),transform .4s var(--ease),opacity .4s var(--ease),box-shadow .4s var(--ease);
}
.pill:hover{box-shadow:0 2px 6px rgba(0,0,0,.04),0 18px 40px -14px rgba(0,0,0,.26)}
@media (min-width:780px){ body:has(.panel:not([hidden-state])) .pill{left:calc((100% - var(--rail) - 28px) / 2)} }
.tools{position:relative;display:flex;gap:2px}
.tools .thumb{
  position:absolute;left:0;top:0;height:40px;width:0;border-radius:20px;background:var(--fillbg);
  transition:transform .45s var(--ease),width .45s var(--ease);
}
.tools button,.pi{
  appearance:none;border:0;background:transparent;cursor:pointer;color:inherit;position:relative;
  height:40px;border-radius:20px;display:flex;align-items:center;gap:8px;
  font:300 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;
  transition:color .3s var(--ease),background .3s var(--ease),transform .3s var(--ease),opacity .3s var(--ease);
}
.tools button{padding:0 14px 0 11px}
.tools button:hover,.tools button[aria-pressed="true"]{color:var(--ink)}
.tools button:active,.pi:active{transform:scale(.96)}
.pi{width:40px;justify-content:center;padding:0}
.pi:hover{color:var(--ink);background:var(--fillbg)}
.pi:disabled{opacity:.35;pointer-events:none}
.pi svg.i{width:16px;height:16px}
.psep{width:1px;height:18px;background:var(--line-2);margin:0 4px}
.ball{width:16px;height:16px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.12)}
.tools svg.i{width:16px;height:16px}

/* ── panel ─────────────────────────────────────── */
.panel{
  position:absolute;background:var(--panel);
  backdrop-filter:blur(16px) saturate(1.3);-webkit-backdrop-filter:blur(16px) saturate(1.3);
  border:1px solid var(--line);border-radius:var(--r);
  box-shadow:0 1px 2px rgba(0,0,0,.03),0 24px 60px -20px rgba(0,0,0,.22);
  display:flex;flex-direction:column;overflow:hidden;
  transition:transform .55s var(--ease),opacity .35s var(--ease);
}
@media (min-width:780px){
  .panel{top:calc(14px + var(--safe-t));right:calc(14px + var(--safe-r));bottom:calc(14px + var(--safe-b));width:var(--rail)}
  .panel[hidden-state]{transform:translateX(calc(100% + 20px));opacity:0;pointer-events:none}
}
@media (max-width:779px){
  .panel{left:10px;right:10px;bottom:calc(10px + var(--safe-b));height:min(58vh,430px);border-radius:22px}
  .panel[hidden-state]{transform:translateY(calc(100% + 24px));opacity:0;pointer-events:none}
  body:has(.panel:not([hidden-state])) .pill{opacity:0;pointer-events:none;transform:translateX(-50%) translateY(12px)}
  body:has(.panel:not([hidden-state])) .stage{bottom:calc(min(58vh,430px) + 24px + var(--safe-b))}
  .tools button{padding:0 10px 0 9px;letter-spacing:.08em}
}
.phead{display:flex;align-items:center;gap:2px;padding:12px 12px 0}
.tabs{display:flex;gap:2px;flex:1}
.tab{
  appearance:none;border:0;background:transparent;cursor:pointer;
  font:300 11px/1 var(--mono);letter-spacing:.06em;
  color:var(--ink-3);padding:7px 9px;border-radius:9px;
  transition:color .3s var(--ease),background .3s var(--ease);
}
.tab:hover{color:var(--ink-2)}
.tab[aria-selected="true"]{color:var(--ink);background:var(--fillbg)}
.xbtn{appearance:none;border:0;background:transparent;color:var(--ink-3);width:30px;height:30px;border-radius:9px;display:grid;place-items:center;cursor:pointer;transition:color .3s var(--ease),background .3s var(--ease)}
.xbtn:hover{color:var(--ink);background:var(--fillbg)}
.xbtn svg.i{width:14px;height:14px}
.pbody{flex:1;overflow-y:auto;overflow-x:hidden;padding:12px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.pane{display:none;flex-direction:column;gap:7px}
.pane.on{display:flex}

/* fill-bar slider: the whole row is the slider */
.ctrl{
  position:relative;height:36px;border-radius:11px;background:var(--fillbg);
  overflow:hidden;display:flex;align-items:center;padding:0 11px;cursor:ew-resize;
  user-select:none;-webkit-user-select:none;flex:none;touch-action:pan-y;
}
.ctrl::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:var(--fill,0%);
  background:var(--fillfg);transition:width .06s linear;
}
.ctrl > span{position:relative;color:var(--ink-2);letter-spacing:.02em;transition:color .3s var(--ease)}
.ctrl > b{position:relative;margin-left:auto;font-weight:400;color:var(--ink);font-variant-numeric:tabular-nums}
.ctrl:hover > span,.ctrl.on > span{color:var(--ink)}
.ctrl input[type=range]{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;pointer-events:none}
.ctrl:focus-within{box-shadow:inset 0 0 0 1px var(--ink-3)}

.row{display:flex;align-items:center;gap:10px;min-height:32px;padding:0 11px;color:var(--ink-2);flex:none}
.row .lab{width:78px;letter-spacing:.02em}
.row input[type=text]{
  border:0;border-bottom:1px solid var(--line-2);background:transparent;border-radius:0;
  font:400 12px/1 var(--mono);color:var(--ink-3);padding:3px 2px;outline:none;
  transition:border-color .3s var(--ease),color .3s var(--ease);-webkit-user-select:text;user-select:text;
}
.row input[type=text]:focus{border-color:var(--ink-3);color:var(--ink)}
.row.tog{cursor:pointer;gap:0}
.row.tog label{cursor:pointer;letter-spacing:.02em}
.row input[type=checkbox]{
  appearance:none;-webkit-appearance:none;width:15px;height:15px;border:1px solid var(--line-2);border-radius:5px;
  background:var(--white);cursor:pointer;position:relative;margin:0 9px 0 0;flex:none;
  transition:background .25s var(--ease),border-color .25s var(--ease);
}
.row input[type=checkbox]:checked{background:var(--ink-2);border-color:var(--ink-2)}
.row input[type=checkbox]:checked::after{
  content:"";position:absolute;left:4px;top:1px;width:4px;height:8px;
  border:solid var(--white);border-width:0 1.4px 1.4px 0;transform:rotate(42deg);
}
.swatch{position:relative;width:19px;height:19px;border-radius:6px;border:1px solid var(--line-2);overflow:hidden;cursor:pointer;flex:none}
.swatch input{position:absolute;inset:-10px;width:40px;height:40px;opacity:0;cursor:pointer;border:0;padding:0}
.hex{width:74px}

.sec{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);padding:12px 11px 3px}
.pane > .sec:first-child{padding-top:2px}
.hint{color:var(--ink-3);padding:2px 11px;line-height:1.75;font-size:11px}
.hint kbd{font:400 10px/1 var(--mono);color:var(--ink-2);padding:2px 4px;border-radius:4px;background:var(--fillbg)}

/* segmented control with a gliding thumb */
.seg{position:relative;display:flex;background:var(--fillbg);border-radius:11px;padding:3px;height:36px;flex:none}
.seg .thumb{
  position:absolute;top:3px;bottom:3px;left:0;width:0;border-radius:8px;background:var(--white);
  box-shadow:0 1px 2px rgba(0,0,0,.06),0 2px 8px -2px rgba(0,0,0,.08);
  transition:transform .45s var(--ease),width .45s var(--ease);
}
.seg button{
  flex:1;position:relative;border:0;background:transparent;cursor:pointer;border-radius:8px;
  font:300 11px/1 var(--mono);letter-spacing:.04em;color:var(--ink-3);padding:0 4px;
  display:flex;align-items:center;justify-content:center;gap:6px;transition:color .3s var(--ease);
}
.seg button:hover{color:var(--ink-2)}
.seg button[aria-pressed="true"]{color:var(--ink)}
.seg svg.i{width:15px;height:15px}

/* material chips */
.mats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.mat{
  appearance:none;height:64px;border:1px solid var(--line);background:var(--white);border-radius:13px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:0 4px;cursor:pointer;color:var(--ink-2);
  font:300 11px/1 var(--mono);letter-spacing:.02em;min-width:0;
  transition:transform .35s var(--ease),color .3s var(--ease),border-color .3s var(--ease),background .3s var(--ease),box-shadow .35s var(--ease);
}
.mat span:last-child{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mat:hover{color:var(--ink);transform:translateY(-2px);box-shadow:0 8px 18px -10px rgba(0,0,0,.18)}
.mat:active{transform:scale(.97)}
.mat[aria-pressed="true"]{background:var(--fillbg);border-color:transparent;color:var(--ink)}
.mat .ball{width:22px;height:22px;transition:transform .45s var(--ease)}
.mat:hover .ball{transform:scale(1.08)}

/* background swatches */
.bgs{display:flex;gap:8px;padding:2px 11px 4px;flex-wrap:wrap}
.bgs button{
  appearance:none;width:26px;height:26px;border-radius:50%;border:1px solid var(--line-2);cursor:pointer;padding:0;
  transition:transform .3s var(--ease),box-shadow .3s var(--ease);
}
.bgs button:hover{transform:translateY(-1px)}
.bgs button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--white),0 0 0 3px var(--ink-3)}
.bgs .clr{background-image:linear-gradient(45deg,var(--fillfg) 25%,transparent 25%,transparent 75%,var(--fillfg) 75%),linear-gradient(45deg,var(--fillfg) 25%,transparent 25%,transparent 75%,var(--fillfg) 75%);background-size:8px 8px;background-position:0 0,4px 4px;background-color:var(--white)}

/* layers */
.layers{display:flex;flex-direction:column;gap:2px}
.lrow{
  display:flex;align-items:center;gap:10px;padding:0 4px 0 11px;height:38px;border-radius:11px;cursor:pointer;
  color:var(--ink-2);transition:background .3s var(--ease),color .3s var(--ease);
}
.lrow:hover{color:var(--ink)}
.lrow[aria-current="true"]{background:var(--fillbg);color:var(--ink)}
.lrow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow small{color:var(--ink-3);font-size:10px;white-space:nowrap}
.lrow.hid .ball{opacity:.3}
.lrow.hid .nm{color:var(--ink-3)}
.acts{display:flex;opacity:0;transition:opacity .25s var(--ease)}
.lrow:hover .acts,.lrow[aria-current="true"] .acts{opacity:1}
@media (hover:none){.acts{opacity:1}}
.acts button{appearance:none;width:26px;height:26px;border:0;background:transparent;border-radius:8px;color:var(--ink-3);display:grid;place-items:center;cursor:pointer;padding:0;transition:color .25s var(--ease),background .25s var(--ease)}
.acts button:hover{color:var(--ink);background:rgba(0,0,0,.04)}
.acts svg.i{width:14px;height:14px}

.btn{
  appearance:none;border:1px solid var(--line-2);background:var(--white);border-radius:11px;
  height:34px;padding:0 12px;cursor:pointer;color:var(--ink-2);
  font:300 11px/1 var(--mono);letter-spacing:.06em;
  transition:transform .3s var(--ease),color .3s var(--ease),border-color .3s var(--ease),background .3s var(--ease);
}
.btn:hover{color:var(--ink);border-color:var(--ink-3)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--fillfg);border-color:transparent;color:var(--ink)}
.btn.primary:hover{background:#d8d4cc}
.btn.quiet{border-color:rgba(192,120,124,.32);color:var(--danger)}
.btn.quiet:hover{border-color:var(--danger)}
.btnrow{display:flex;gap:6px}
.btnrow .btn{flex:1}

.veil{
  position:fixed;inset:0;z-index:20;display:none;place-items:center;
  background:rgba(250,250,248,.82);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  color:var(--ink-2);letter-spacing:.1em;text-transform:uppercase;font-size:11px;
}
.veil.on{display:grid}
.toast{
  position:fixed;left:50%;bottom:calc(92px + var(--safe-b));transform:translateX(-50%) translateY(8px);
  background:var(--toast);color:var(--white);border-radius:999px;padding:9px 16px;
  font-size:11px;letter-spacing:.06em;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  opacity:0;pointer-events:none;transition:opacity .35s var(--ease),transform .45s var(--ease);
  z-index:30;white-space:nowrap;display:flex;align-items:center;gap:12px;
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
.toast button{appearance:none;border:0;background:rgba(255,255,255,.14);color:var(--white);border-radius:999px;height:24px;padding:0 10px;font:400 10px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.toast button:hover{background:rgba(255,255,255,.24)}
.fatal{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:var(--ink-2);line-height:1.8}
@media (hover:none){.iconbtn:hover,.btn:hover,.mat:hover{transform:none}}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01s!important}}
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="board" id="board">
    <canvas id="c"></canvas>
    <svg class="guides" id="guides" preserveAspectRatio="none"></svg>
    <div class="empty" id="empty">Draw anywhere. Slow down to pool, speed up to thin.</div>
  </div>
</div>
<div class="ring" id="ring"></div>

<div class="chrome">
  <div class="brand">Slip &amp; Metal</div>
  <div class="stat" id="stat">&nbsp;</div>

  <div class="topright">
    <div class="zoombar" id="zoombar">
      <button class="zstep" data-z="out" title="Zoom out (−)">−</button>

  cp.append(sec('Layers'), h('div', { class: 'layers', id: 'layers' }),
    h('div', { class: 'btnrow' },
      h('button', { type: 'button', class: 'btn', onclick: () => { mutate(() => { const nl = newLayer(ui.brush); doc.layers.push(nl); doc.active = nl.id; }); if (ui.tool === 'erase') ui.tool = ui.brush; afterChange(); } }, `New ${NAMES[ui.brush].toLowerCase()} layer`)));

  }
  cp.append(sec('Background'), bgs);
  if (doc.bg !== 'none') cp.append(colorRow('Colour', () => doc.bg, v => { doc.bg = v; doc.bgImage = null; markBgs(); request(); }));
  cp.append(h('div', { class: 'btnrow' },
    h('button', { type: 'button', class: 'btn', onclick: () => $('#file').click() }, doc.bgImage ? 'Replace image' : 'Draw on an image'),
    doc.bgImage ? h('button', { type: 'button', class: 'btn', onclick: () => { mutate(() => { doc.bgImage = null; }); afterChange(); } }, 'Remove image') : null));
  cp.append(sec('Export'),
    seg([['1', '1×'], ['2', '2×'], ['3', '3×'], ['4', '4×']], () => ui.exp.scale, v => { ui.exp.scale = +v; save(); }),
    toggleRow('Transparent background', () => ui.exp.transparent, v => ui.exp.transparent = v),
    toggleRow('Crop to drawing', () => ui.exp.crop, v => ui.exp.crop = v),
    h('div', { class: 'btnrow' }, h('button', { type: 'button', class: 'btn primary', onclick: exportPNG }, 'Export PNG')),
    sec('Reset'),
    h('div', { class: 'btnrow' },
      h('button', { type: 'button', class: 'btn quiet', onclick: clearLayer }, 'Clear layer'),
      h('button', { type: 'button', class: 'btn quiet', onclick: clearAll }, 'Clear all')),
    hint(isTouchUI
      ? 'Two-finger tap to undo, three-finger tap to redo. Pinch to zoom. Once a Pencil touches the screen, fingers only navigate.'
      : '<kbd>⌘Z</kbd> undo · <kbd>⇧⌘Z</kbd> redo · <kbd>[</kbd> <kbd>]</kbd> size · <kbd>B</kbd> next brush · <kbd>E</kbd> eraser · hold <kbd>Space</kbd> to pan · <kbd>⌘</kbd>+scroll to zoom · <kbd>S</kbd> panel'));
  renderLayers();
  showTab(ui.tab);
}
function markPresets() {
  const L = activeLayer();
  $$('.mat').forEach(b => b.setAttribute('aria-pressed', String(!!L && L.params.preset === b.dataset.name)));
}
function markBgs() { $$('.bgs button').forEach((b, i) => b.setAttribute('aria-pressed', String(BGS[i][1] === doc.bg && !doc.bgImage))); }

function renderLayers() {
  const box = $('#layers');
  if (!box) return;
  box.replaceChildren();
  if (!doc.layers.length) { box.append(hint('No layers yet. Your first stroke makes one.')); return; }
  for (let i = doc.layers.length - 1; i >= 0; i--) {
    const L = doc.layers[i];
    const btn = (icon, title, fn) => h('button', { type: 'button', title, html: icon, onclick: e => { e.stopPropagation(); fn(); } });
    const row = h('div', { class: 'lrow' + (L.visible ? '' : ' hid'), 'aria-current': String(L.id === doc.active), role: 'button', tabindex: '0',
      onclick: () => selectLayer(L.id) },
      h('span', { class: 'ball', style: `background:${ballCss(L)}` }),
      h('span', { class: 'nm' }, L.name),
      h('small', null, L.strokes.length ? String(L.strokes.length) : 'empty'),
      h('span', { class: 'acts' },
        btn(L.visible ? ICON.eye : ICON.eyeOff, L.visible ? 'Hide' : 'Show', () => { mutate(() => { L.visible = !L.visible; }); renderLayers(); request(); }),
        i < doc.layers.length - 1 ? btn(ICON.up, 'Move up', () => moveLayer(i, 1)) : null,
        i > 0 ? btn(ICON.down, 'Move down', () => moveLayer(i, -1)) : null,
        btn(ICON.del, 'Delete layer', () => deleteLayer(L.id))));
    box.append(row);
  }
}
function selectLayer(id) {
  doc.active = id;

  ui.brush = L.brush;
  if (ui.tool !== 'erase') ui.tool = L.brush;
  afterChange();
}
function moveLayer(i, d) {
  mutate(() => { const ls = doc.layers; [ls[i], ls[i + d]] = [ls[i + d], ls[i]]; });
  renderLayers(); request();
}
function deleteLayer(id) {
  const L = layerById(id);
  mutate(() => {
    doc.layers = doc.layers.filter(l => l.id !== id);
    if (doc.active === id) doc.active = doc.layers.length ? doc.layers[doc.layers.length - 1].id : null;
  });
  gcTargets(); afterChange();
  toast(`${L.name} deleted`, { label: 'Undo', fn: undo });
}
function clearLayer() {
  const L = activeLayer();
  if (!L || !L.strokes.length) return;
  mutate(() => { L.strokes = []; });
  dirty.add(L.id); afterChange();
  toast(`${L.name} cleared`, { label: 'Undo', fn: undo });
}
function clearAll() {
  if (!doc.layers.some(L => L.strokes.length)) return;
  mutate(() => { const nl = newLayer(ui.brush); nl.name = NAMES[ui.brush]; doc.layers = [nl]; doc.active = nl.id; });
  gcTargets(); afterChange();
  toast('Canvas cleared', { label: 'Undo', fn: undo });
}
function resizeDoc(w, hgt) {
  const dx = (w - doc.w) / 2, dy = (hgt - doc.h) / 2;
  if (dx || dy) {
    for (const L of doc.layers) {
      L.strokes = L.strokes.map(s => { const p = s.pts.slice(); for (let i = 0; i < p.length; i += 5) { p[i] += dx; p[i + 1] += dy; } return { ...s, pts: p }; });
      dirty.add(L.id);
    }
  }
  doc.w = w; doc.h = hgt;
  view.z = 1; fit(); updateResolution();
}
function updateGuides() {
  const g = $('#guides');
  g.setAttribute('viewBox', `0 0 ${doc.w} ${doc.h}`);
  board.classList.toggle('clear', doc.bg === 'none' && !doc.bgImage);
  const cx = doc.w / 2, cy = doc.h / 2, R = Math.hypot(doc.w, doc.h);
  const lines = [];
  if (ui.sym === 'x' || ui.sym === 'xy') lines.push([cx, 0, cx, doc.h]);
  if (ui.sym === 'y' || ui.sym === 'xy') lines.push([0, cy, doc.w, cy]);
  if (ui.sym === 'r6') for (let i = 0; i < 3; i++) { const a = i * Math.PI / 3 + Math.PI / 6; lines.push([cx - Math.cos(a) * R, cy - Math.sin(a) * R, cx + Math.cos(a) * R, cy + Math.sin(a) * R]); }
  g.innerHTML = lines.map(l => `<line x1="${l[0]}" y1="${l[1]}" x2="${l[2]}" y2="${l[3]}"/>`).join('');
}

/* ════════════════════════════════════════════════════════════════════
   images in
   ════════════════════════════════════════════════════════════════════ */
function loadImageFile(file) {
  if (!file || !file.type.startsWith('image/')) return;
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = () => {
    const k = Math.min(1, 2000 / Math.max(img.naturalWidth, img.naturalHeight));
    const w = Math.max(200, Math.round(img.naturalWidth * k)), hgt = Math.max(200, Math.round(img.naturalHeight * k));
    const cv = document.createElement('canvas'); cv.width = w; cv.height = hgt;
    cv.getContext('2d').drawImage(img, 0, 0, w, hgt);
    URL.revokeObjectURL(url);
    mutate(() => { resizeDoc(w, hgt); doc.bgImage = cv; });
    afterChange();
    toast(`${w}×${hgt}`);
  };
  img.onerror = () => { URL.revokeObjectURL(url); toast("That image couldn't be read"); };
  img.src = url;
}
$('#btnImage').onclick = () => $('#file').click();
$('#file').onchange = e => { loadImageFile(e.target.files[0]); e.target.value = ''; };
{
  const veil = $('#veil'); let depth = 0;
  addEventListener('dragenter', e => { if ([...(e.dataTransfer?.types || [])].includes('Files')) { depth++; veil.classList.add('on'); e.preventDefault(); } });
  addEventListener('dragleave', () => { depth = Math.max(0, depth - 1); if (!depth) veil.classList.remove('on'); });
  addEventListener('dragover', e => e.preventDefault());
  addEventListener('drop', e => { e.preventDefault(); depth = 0; veil.classList.remove('on'); loadImageFile(e.dataTransfer.files[0]); });
  addEventListener('paste', e => { const f = [...(e.clipboardData?.files || [])].find(f => f.type.startsWith('image/')); if (f) loadImageFile(f); });
}

/* ════════════════════════════════════════════════════════════════════
   export: rebuild every layer at k× and composite off-screen
   ════════════════════════════════════════════════════════════════════ */
let exporting = false;
async function exportPNG() {
  if (exporting) return;
  if (!doc.layers.some(L => L.visible && L.strokes.length)) { toast('Nothing to export yet'); return; }
  exporting = true;
  toast('Rendering…');
  await new Promise(r => setTimeout(r, 30));
  try {
    const lim = Math.min(gl.getParameter(gl.MAX_TEXTURE_SIZE), gl.getParameter(gl.MAX_RENDERBUFFER_SIZE), 8192);
    let S = Math.min(ui.exp.scale, lim / doc.w, lim / doc.h);
    const cap = isTouchUI ? 16e6 : 36e6;
    if (doc.w * doc.h * S * S > cap) S = Math.sqrt(cap / (doc.w * doc.h));
    const w = Math.round(doc.w * S), hgt = Math.round(doc.h * S);
    S = w / doc.w;
    const ctx = { field: makeTarget(w, hgt, FIELD), scratch: makeTarget(w, hgt, FIELD), erase: makeTarget(w, hgt, FIELD), minSig: .7 / S };
    const out = makeTarget(w, hgt, FMT8);
    const bounds = [Infinity, Infinity, -Infinity, -Infinity];
    drawBg(out, ui.exp.transparent);
    for (const L of doc.layers) {
      if (!L.visible || !L.strokes.length) continue;
      const lb = [Infinity, Infinity, -Infinity, -Infinity];
      buildLayer(L, ctx, lb);
      const pad = (L.params.size * .24 + 3) * L.params.vol * 1.6 + 6;
      bounds[0] = Math.min(bounds[0], lb[0] - pad); bounds[1] = Math.min(bounds[1], lb[1] - pad);
      bounds[2] = Math.max(bounds[2], lb[2] + pad); bounds[3] = Math.max(bounds[3], lb[3] + pad);
      drawLayer(L, ctx.field.tex, out, w, hgt);
    }
    let x0 = 0, y0 = 0, x1 = w, y1 = hgt;
    if (ui.exp.crop && isFinite(bounds[0])) {
      x0 = clamp(Math.floor(bounds[0] * S), 0, w); y0 = clamp(Math.floor(bounds[1] * S), 0, hgt);
      x1 = clamp(Math.ceil(bounds[2] * S), 0, w); y1 = clamp(Math.ceil(bounds[3] * S), 0, hgt);
    }
    const cw = Math.max(1, x1 - x0), ch = Math.max(1, y1 - y0);
    const px = new Uint8Array(cw * ch * 4);
    gl.bindFramebuffer(gl.FRAMEBUFFER, out.fb);
    gl.readPixels(x0, hgt - y1, cw, ch, gl.RGBA, gl.UNSIGNED_BYTE, px);
    [ctx.field, ctx.scratch, ctx.erase, out].forEach(freeTarget);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    const cv = document.createElement('canvas'); cv.width = cw; cv.height = ch;
    const c2 = cv.getContext('2d');
    const id = c2.createImageData(cw, ch), d = id.data;
    for (let y = 0; y < ch; y++) {
      const src = (ch - 1 - y) * cw * 4, dst = y * cw * 4;
      for (let x = 0; x < cw * 4; x += 4) {
        const a = px[src + x + 3];
        const k = a ? 255 / a : 0;
        d[dst + x] = Math.min(255, px[src + x] * k); d[dst + x + 1] = Math.min(255, px[src + x + 1] * k);
        d[dst + x + 2] = Math.min(255, px[src + x + 2] * k); d[dst + x + 3] = a;
      }
    }
    c2.putImageData(id, 0, 0);
    const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
    const now = new Date(), pad = n => String(n).padStart(2, '0');
    const name = `slip-metal-${now.getFullYear()}${pad(now.getMonth() + 1)}${pad(now.getDate())}-${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}.png`;
    if (window.claude && window.claude.use) {          // inside a claude.ai artifact: the viewer owns saving
      const dl = await window.claude.use('downloads');
      if (!dl) { toast('Saving is not available in this view'); return; }
      try { await dl.save({ filename: name, data: blob }); toast(`Saved PNG · ${cw}×${ch}`); }
      catch (err) { toast(err && err.code === 'declined' ? 'Export cancelled' : 'Saving is not available in this view'); }
      return;
    }
    const file = new File([blob], name, { type: 'image/png' });
    let shared = false;
    if (isTouchUI && navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file] }); shared = true; } catch (e) { shared = e && e.name === 'AbortError'; }
    }
    if (!shared) {
      const url = URL.createObjectURL(blob);
      const a = h('a', { href: url, download: name });
      document.body.append(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 5000);
    }
    toast(`Saved PNG · ${cw}×${ch}`);
  } catch (err) {
    console.error(err);
    toast('Export failed: ' + (err.message || err));
  } finally {
    exporting = false;
    for (const L of doc.layers) dirty.add(L.id);   // targets were reused; make sure screen fields are intact
    request();
  }
}
$('#btnExport').onclick = exportPNG;

/* ════════════════════════════════════════════════════════════════════
   first-run sample: a few synthetic gestures so the tool opens showing what it does
   ════════════════════════════════════════════════════════════════════ */
function synth(path, { dur = 1600, speed = () => 1, pressure = () => .5, N = 700, hold = 0 } = {}) {
  const P = [];
  for (let i = 0; i <= N; i++) P.push(path(i / N));
  const segT = [];
  let tot = 0;
  for (let i = 1; i <= N; i++) { const l = Math.hypot(P[i][0] - P[i - 1][0], P[i][1] - P[i - 1][1]) / speed(i / N); segT.push(l); tot += l; }
  const pts = [];
  let t = 0;
  for (let i = 0; i <= N; i++) {
    if (i) t += segT[i - 1] / tot * dur;
    pts.push(P[i][0], P[i][1], pressure(i / N), t, 1);
  }
  for (let k = 1; k <= hold; k++) pts.push(P[N][0], P[N][1], pressure(1), t + k * 16, 1);
  return { id: uid(), seed: Math.random() * 1000, sym: 'off', erase: false, hasP: true, hasT: false, pts };
}
function seedDemo() {
  doc = { w: 1600, h: 1200, bg: '#E2DFD8', bgImage: null, layers: [], active: null };
  const slip = newLayer('slip');
  slip.strokes.push(synth(u => {
    const a = u * Math.PI * 2 * 3.3;
    return [250 + 1080 * u - 120 * Math.sin(a), 690 + 190 * Math.cos(a) * (1 - .25 * u) - 120 * Math.sin(u * Math.PI)];
  }, { dur: 2300, speed: u => .55 + .9 * Math.abs(Math.sin(u * Math.PI * 2 * 3.3 + .4)), pressure: u => .35 + .35 * Math.sin(u * Math.PI) }));
  slip.strokes.push(synth(u => [292 + u * .5, 360 + u * .5], { dur: 60, N: 4, hold: 40, pressure: () => .5 }));
  const metal = newLayer('metal');
  metal.strokes.push(synth(u => {
    const x = 340 + 980 * u;
    return [x, 300 + 150 * Math.sin(u * Math.PI * 1.6 + .3) + 60 * Math.sin(u * Math.PI * 5)];
  }, { dur: 1500, speed: u => .5 + 1.1 * Math.abs(Math.cos(u * Math.PI * 5)), pressure: u => .3 + .45 * Math.sin(u * Math.PI) }));
  metal.strokes.push(synth(u => {
    const a = u * Math.PI * 2 * 1.15;
    return [1180 + 150 * Math.cos(a) * (1 - .45 * u), 930 + 120 * Math.sin(a) * (1 - .45 * u)];
  }, { dur: 1100, speed: u => .6 + .6 * u, pressure: u => .5 + .3 * Math.sin(u * Math.PI) }));
  doc.layers.push(slip, metal);
  doc.active = metal.id;
  ui.tool = ui.brush = 'metal';
}

   boot
