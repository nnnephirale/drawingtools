<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Slip &amp; Metal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
@@ css/00-tokens.css
@@ css/10-stage.css
@@ css/20-chrome.css
@@ css/30-tool-pill.css
@@ css/40-panel.css
@@ css/50-controls.css
@@ css/60-sessions-overlays.css
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="board" id="board">
    <canvas id="c"></canvas>
    <svg class="guides" id="guides" preserveAspectRatio="none"></svg>
    <svg class="guides selg" id="selg" preserveAspectRatio="none"></svg>
    <div class="empty" id="empty">Draw anywhere. Slow down to pool, speed up to thin.</div>
  </div>
</div>
<div class="ring" id="ring"></div>

<div class="chrome">
  <div class="brand">Slip &amp; Metal</div>
  <div class="stat" id="stat">&nbsp;</div>

  <div class="topright">
    <div class="zoombar" id="zoombar">
      <button class="zstep" data-z="out" title="Zoom out (−)">−</button>
      <button class="zpct" data-z="pct" title="Zoom presets">100%</button>
      <button class="zstep" data-z="in" title="Zoom in (+)">+</button>
      <div class="zsep"></div>
      <button class="zfit" data-z="fit" title="Fit (0)">Fit</button>
      <div class="zmenu" data-z="menu"></div>
    </div>
    <button class="iconbtn" id="btnImage" title="Draw on an image">
      <svg class="i" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="M5 17.5l4.5-4.5 3 3 2.5-2.5 4 4"/></svg>
    </button>
    <button class="iconbtn" id="btnExport" title="Export PNG">
      <svg class="i" viewBox="0 0 24 24"><path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M5 19.5h14"/></svg>
    </button>
    <button class="iconbtn" id="btnPanel" title="Settings (S)">
      <svg class="i" viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>
    </button>
  </div>

  <div class="pill" id="pill">
    <div class="tools" id="tools">
      <i class="thumb"></i>
      <button data-tool="slip" title="Slip (B)"><span class="ball" id="ballSlip"></span>Slip</button>
      <button data-tool="stone" title="Stone (B)"><span class="ball" id="ballStone"></span>Stone</button>
      <button data-tool="clay" title="Clay (B)"><span class="ball" id="ballClay"></span>Clay</button>
      <button data-tool="erase" title="Eraser (E)">
        <svg class="i" viewBox="0 0 24 24"><path d="M14.5 5.5l4 4-8.5 8.5H6l-1.5-1.5a1.5 1.5 0 010-2.1z"/><path d="M10 18h9"/></svg>Erase
      </button>
      <button data-tool="lasso" title="Lasso: select and move (L)">
        <svg class="i" viewBox="0 0 24 24"><path d="M8.6 15.2C6 14.3 4.5 12.5 4.5 10.5c0-3.3 3.4-6 7.5-6s7.5 2.7 7.5 6-3.4 6-7.5 6c-.8 0-1.6-.1-2.3-.3"/><path d="M9.7 16.2c-.9.8-1.4 1.7-1.2 2.6.2 1 1.3 1.7 2.6 1.7"/></svg>Lasso
      </button>
      <button data-tool="view" title="3D view (3)">
        <svg class="i" viewBox="0 0 24 24"><path d="M12 3.5l7.5 4.2v8.6L12 20.5l-7.5-4.2V7.7z"/><path d="M4.5 7.7L12 12l7.5-4.3M12 12v8.5"/></svg>3D
      </button>
    </div>
    <button class="tchip c3d" id="c3d" type="button" title="Canvas under the drawing (C)" aria-pressed="true"><i></i>Canvas</button>
    <div class="tchip lchip" id="lchip">
      <button type="button" data-scope="all" title="Lasso takes every visible layer">All</button>
      <button type="button" data-scope="layer" title="Lasso takes the active layer only">Layer</button>
      <button type="button" class="ldel" id="ldel" title="Delete the selection (⌫)"><svg class="i" viewBox="0 0 24 24"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12"/></svg></button>
    </div>
    <span class="psep"></span>
    <button class="pi" id="undo" title="Undo (⌘Z)"><svg class="i" viewBox="0 0 24 24"><path d="M9 7L5 11l4 4"/><path d="M5 11h9a5 5 0 010 10h-2"/></svg></button>
    <button class="pi" id="redo" title="Redo (⇧⌘Z)"><svg class="i" viewBox="0 0 24 24"><path d="M15 7l4 4-4 4"/><path d="M19 11h-9a5 5 0 000 10h2"/></svg></button>
  </div>

  <aside class="panel" id="panel">
    <div class="phead">
      <div class="tabs" role="tablist">
        <button class="tab" data-tab="brush" role="tab">Brush</button>
        <button class="tab" data-tab="surface" role="tab">Surface</button>
        <button class="tab" data-tab="canvas" role="tab">Canvas</button>
        <button class="tab" data-tab="sessions" role="tab">Sessions</button>
      </div>
      <button class="xbtn" id="closePanel" title="Close (Esc)"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="pbody" id="pbody">
      <div class="pane" data-pane="brush"></div>
      <div class="pane" data-pane="surface"></div>
      <div class="pane" data-pane="canvas"></div>
      <div class="pane" data-pane="sessions"></div>
    </div>
  </aside>
</div>

<div class="veil" id="veil">Drop an image to draw on it</div>
<div class="toast" id="toast"></div>
<input type="file" id="file" accept="image/*" hidden>
<input type="file" id="sessFile" accept=".json,application/json" hidden>

<script src="js/shaders.js"></script>
<script>
@@ js/00-helpers.js
@@ js/05-brushes.js
@@ js/10-state.js
@@ js/15-webgl.js
@@ js/20-stamps.js
@@ js/25-fields.js
@@ js/30-compositing.js
@@ js/32-scene-light.js
@@ js/35-view-3d.js
@@ js/40-frame-loop.js
@@ js/45-view.js
@@ js/50-history.js
@@ js/55-input.js
@@ js/60-ui.js
@@ js/65-images-in.js
@@ js/70-export-png.js
@@ js/75-export-models.js
@@ js/80-first-run-sample.js
@@ js/85-boot.js
</script>
</body>
</html>
